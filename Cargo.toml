[package]
name = "memreduct"
version = "3.5.3"
edition = "2021"
authors = ["Henry++", "YourName"]
description = "High-performance memory cleaner written in Rust"
license = "GPL-3.0"
readme = "README.md"
keywords = ["memory", "cleaner", "windows", "win32", "memreduct"]

[dependencies]
windows-sys = { version = "0.59", default-features = false, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse"
] }

[build-dependencies]
winres = "0.1"

# Cấu hình tối ưu dung lượng siêu nhẹ và tốc độ thực thi cao nhất
[profile.release]
opt-level = "z"         # Tối ưu kích thước mã máy tối đa, tăng cache locality
lto = "fat"             # Link-Time Optimization cấp cao nhất, loại bỏ mã dư thừa
codegen-units = 1       # Biên dịch thành một khối duy nhất để tối ưu xuyên suốt
panic = "abort"         # Bỏ bảng unwinding stack, giảm mạnh kích thước nhị phân
strip = true            # Xóa toàn bộ symbol bảng debug
overflow-checks = false # Giảm kiểm tra tràn số lúc runtime để mã mượt nhất

name: Bug Report
description: File a clear and concise report to help us fix the issue.
title: "[Bug]: "
labels: ["bug"]

body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true

  - type: input
    id: version
    attributes:
      label: App Version
      placeholder: e.g., 1.4.2
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: e.g., Windows 11 (23H2)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Briefly explain what is broken.
      placeholder: A short and clear summary of the bug...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: What steps do we need to take to reproduce the issue?
      placeholder: |
        1. Open the app
        2. Navigate to '...'
        3. Click '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: What actually happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: What did you expect to happen instead?
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / Stack Trace
      description: Paste debug output or error logs here (it will automatically format as code).
      render: shell
    validations:
      required: false

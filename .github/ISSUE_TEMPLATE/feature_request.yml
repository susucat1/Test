name: Feature Request
description: Suggest an idea or propose a new feature for the project.
title: "[Feature]: "
labels: ["feature"]

body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues to ensure this is not a duplicate.
          required: true
        - label: This issue requests a single feature, not a bundle of unrelated ideas.
          required: true

  - type: input
    id: version
    attributes:
      label: App Version
      placeholder: e.g., 1.4.2
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem or limitation are you trying to solve?
      placeholder: A clear description of the pain point or problem (e.g., "I'm always frustrated when...")
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should the application address this?
      placeholder: Describe the solution you'd like to see, how it should work, and the expected flow...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: Describe other options you've tried or thought about (optional)...
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Mockups & Additional Context
      description: Add any UI mockups, sketches, technical notes, or references.
      placeholder: Attach mockups or describe the UI interactions...
    validations:
      required: false
